[project]
name = "unpreprocess"
version = "0.1.0"
requires-python = ">=3.14"
readme = "README.md"
license-files = [
    "LICENSE",
]

dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
